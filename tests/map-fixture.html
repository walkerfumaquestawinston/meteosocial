<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app/style.css"><style>body{margin:0}.local-map-shell{inset:0 0 76px}#fixture-label{position:fixed;bottom:0;color:white;background:#211;padding:12px;z-index:100}</style><body><main id="main"></main><div id="fixture-label">TEST LOCALE · cartografia simulata · nessun dato pubblicato</div><script type="module">
import {createLocalMap} from '/local-map.js';
const savedFetch=window.fetch;window.fetch=async(url,opts)=>{const text=String(url);if(text.includes('weather-maps.json'))return new Response(JSON.stringify({host:'https://tilecache.rainviewer.com',radar:{past:[]}}),{headers:{'Content-Type':'application/json'}});if(text.startsWith('https://api.open-meteo.com/v1/forecast?')){const p=new URL(text).searchParams,lat=p.get('latitude').split(',');return new Response(JSON.stringify(lat.map(()=>({current:{temperature_2m:10,wind_speed_10m:30,wind_direction_10m:270,time:Math.floor(Date.now()/1000)}}))),{headers:{'Content-Type':'application/json'}})}return savedFetch(url,opts)};
class TestMap{constructor(opts){this.opts=opts;this.center={lng:opts.center[0],lat:opts.center[1]};this.zoom=opts.zoom;this.events={};this.sources={};this.layers={};this.dragRotate={disable(){}};this.touchZoomRotate={disableRotation(){}};this.host=opts.container;this.canvas=document.createElement('canvas');this.host.append(this.canvas);queueMicrotask(()=>this.emit('load'))}on(name,fn){(this.events[name]??=[]).push(fn)}off(name,fn){this.events[name]=(this.events[name]||[]).filter(f=>f!==fn)}once(name,fn){const f=(...a)=>{this.events[name]=this.events[name].filter(x=>x!==f);fn(...a)};this.on(name,f)}emit(name,data){for(const f of [...this.events[name]||[]])f(data)}addControl(){}addSource(name,value){this.sources[name]={...value,setData:d=>{this.sources[name].data=d;this.emit('sourcedata',{sourceId:name})}}}getSource(name){return this.sources[name]}isSourceLoaded(){return true}addLayer(layer){this.layers[layer.id]=layer}getLayer(id){return this.layers[id]}setPaintProperty(){}getContainer(){return this.host}getCanvas(){return this.canvas}getCenter(){return this.center}getZoom(){return this.zoom}getBounds(){return {getWest:()=>this.center.lng-.08,getEast:()=>this.center.lng+.08,getSouth:()=>this.center.lat-.08,getNorth:()=>this.center.lat+.08}}project(ll){let lng=ll.lng??ll[0],lat=ll.lat??ll[1];return {x:this.host.clientWidth/2+(lng-this.center.lng)*2000,y:this.host.clientHeight/2-(lat-this.center.lat)*2000}}unproject([x,y]){return {lng:this.center.lng+(x-this.host.clientWidth/2)/2000,lat:this.center.lat-(y-this.host.clientHeight/2)/2000}}querySourceFeatures(id){return this.sources[id]?.data.features||[]}flyTo(opts){document.body.dataset.flight=String(opts.duration);this.jumpTo(opts)}easeTo(opts){this.jumpTo(opts)}jumpTo(opts){this.center={lng:opts.center[0],lat:opts.center[1]};this.zoom=opts.zoom;this.emit('moveend')}stop(){}setMinZoom(){}remove(){}isStyleLoaded(){return true}}
class Marker{constructor({element}){this.element=element}setLngLat(p){this.point=p;return this}addTo(map){this.element.style.position='absolute';this.element.style.left='30%';this.element.style.top='40%';map.host.append(this.element);return this}remove(){this.element.remove()}}
window.maplibregl={Map:TestMap,Marker,NavigationControl:class{}};
const place={name:'Città di prova',latitude:42.9568,longitude:13.8768,source:'gps'},weather={current:{temperature_2m:22,weather_code:0}};
const ctx={get:()=>({route:'mappa',place,weather}),toast:text=>document.querySelector('#fixture-label').textContent=text,api:async(path,body)=>{document.body.dataset.lastApi=path;return {}},choose(){},showZone(){}};
const app=createLocalMap(ctx);document.querySelector('#main').innerHTML=app.page();app.setData({reports:[{id:'own-report',kind:'rain',level:4,phenomenon:'',name:'Test locale',city:'Città di prova',latitude:42.9568,longitude:13.8768,created:Date.now()-180000,expires:Date.now()+7000000,own:true,confirms:0}]});await app.bind();
</script></body></html>
