<title>MeteoSocial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B1526; --bg2:#0F1D33; --surface:#152640; --surface2:#1B3050; --line:#25395A;
  --ink:#EAF1FB; --ink2:#A9B8D0; --ink3:#728299;
  --accent:#38BDF8; --accent-ink:#06121F; --sun:#F5B841; --rain:#6C8CFF; --storm:#F87171; --ok:#4ADE80;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:14px; --rs:9px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF3F9; --bg2:#E3EAF3; --surface:#FFFFFF; --surface2:#F3F6FA; --line:#D5DEEA;
  --ink:#0F1B2E; --ink2:#46566E; --ink3:#7A889B;
  --accent:#0284C7; --accent-ink:#FFFFFF; --sun:#D9970F; --rain:#3B5BDB; --storm:#DC2626; --ok:#15803D;
  --shadow:0 10px 30px rgba(15,27,46,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF3F9; --bg2:#E3EAF3; --surface:#FFFFFF; --surface2:#F3F6FA; --line:#D5DEEA;
    --ink:#0F1B2E; --ink2:#46566E; --ink3:#7A889B;
    --accent:#0284C7; --accent-ink:#FFFFFF; --sun:#D9970F; --rain:#3B5BDB; --storm:#DC2626; --ok:#15803D;
    --shadow:0 10px 30px rgba(15,27,46,.10);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Sora,Manrope,system-ui,sans-serif;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100dvh;min-height:100vh;max-width:100vw;overflow:hidden}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;min-width:0;border-bottom:1px solid var(--line);background:var(--bg2);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-family:Sora,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7DD3FC,#0369A1 60%,#0B1526 100%);box-shadow:0 0 0 2px var(--line),0 0 18px rgba(56,189,248,.45);position:relative}
.logo .mark::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--sun);box-shadow:0 0 10px var(--sun)}
.search{flex:1 1 120px;min-width:0;position:relative;max-width:520px}
.search input{width:100%;padding:9px 12px 9px 36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.search .drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);box-shadow:var(--shadow);max-height:300px;overflow:auto;z-index:20}
.search .drop button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:9px 12px;text-align:left;gap:10px}
.search .drop button:hover,.search .drop button.hl{background:var(--surface2)}
.search .drop .c{color:var(--ink3);font-size:12px}
.tools{display:flex;gap:6px;margin-left:auto;align-items:center;flex:0 0 auto}
@media (max-width:640px){.logo span:last-child{display:none}.top{gap:8px;padding:8px 12px}#shareBtn span[data-i18n]{display:none}#online{display:none}.search input{padding-left:32px}}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
.ib:hover{color:var(--ink);border-color:var(--accent)}
.ib.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ib.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.online{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:0 10px;height:36px;border-radius:999px;border:1px dashed var(--line)}
.online i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block}
/* main */
.main{position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow:auto;padding:18px 16px 24px;display:none}
.view.active{display:block}
.view.full{padding:0}
.wrap{max-width:1100px;margin:0 auto}
/* nav */
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--bg2);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:10px;color:var(--ink3);font-size:11px;font-weight:600;min-width:58px}
.nav button svg{width:22px;height:22px}
.nav button.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
@media (min-width:900px){
  .app{grid-template-rows:auto 1fr;grid-template-columns:200px 1fr}
  .top{grid-column:1/-1}
  .nav{grid-row:2;grid-column:1;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:14px 10px;gap:4px}
  .nav button{flex-direction:row;gap:10px;font-size:14px;padding:10px 12px;justify-content:flex-start;width:100%}
  .main{grid-row:2;grid-column:2}
}
/* globe / map canvases */
.stage{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,#132445 0%,#0B1526 55%,#060B15 100%)}
:root[data-theme="light"] .stage{background:radial-gradient(ellipse at 50% 60%,#DDE9F7 0%,#EEF3F9 60%,#E3EAF3 100%)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .stage{background:radial-gradient(ellipse at 50% 60%,#DDE9F7 0%,#EEF3F9 60%,#E3EAF3 100%)}}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;flex-wrap:wrap}
.overlay>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);backdrop-filter:blur(8px)}
.chip.on{color:var(--accent);border-color:var(--accent)}
.legend{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--ink2)}
.legend .bar{width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,#6C8CFF,#38BDF8,#4ADE80,#F5B841,#F87171)}
.mapctl{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.mapctl .ib{width:40px;height:40px;padding:0;font-size:18px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:7px 10px;font-size:13px;box-shadow:var(--shadow);display:none;white-space:nowrap;z-index:6}
.tip b{font-family:Sora,sans-serif}
.card-float{position:absolute;left:16px;bottom:16px;width:min(340px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:none}
.card-float.show{display:block}
.card-float h3{font-size:18px}
.card-float .row{display:flex;align-items:center;gap:12px;margin-top:6px}
.card-float .t{font-family:Sora,sans-serif;font-size:36px;font-weight:600;line-height:1}
.card-float .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
/* weather view */
.hero{background:linear-gradient(145deg,#1E3A8A 0%,#0C4A6E 55%,#0B1526 100%);color:#fff;border-radius:20px;padding:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero.day{background:linear-gradient(145deg,#0EA5E9 0%,#2563EB 60%,#1E3A8A 100%)}
.hero.storm{background:linear-gradient(145deg,#334155 0%,#1E293B 60%,#0F172A 100%)}
.hero.rain{background:linear-gradient(145deg,#475569 0%,#1E40AF 70%,#0B1526 100%)}
.hero .place{font-size:13px;opacity:.85;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.hero h2{font-size:30px;margin-top:2px}
.hero .big{display:flex;align-items:center;gap:18px;margin-top:10px}
.hero .temp{font-family:Sora,sans-serif;font-size:72px;font-weight:600;line-height:1;letter-spacing:-.03em}
.hero .sym{font-size:56px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25))}
.hero .desc{font-size:17px;font-weight:600;margin-top:4px}
.hero .mm{display:flex;gap:18px;margin-top:12px;font-size:14px;opacity:.95;flex-wrap:wrap}
.hero .mm b{font-family:Sora,sans-serif;font-weight:600}
.hero .stamp{position:absolute;right:16px;top:14px;font-size:11px;background:rgba(255,255,255,.14);padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px)}
.hero .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero .ib{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .ib.primary{background:#fff;color:#0C4A6E}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h3 small{font-weight:500;color:var(--ink3);font-size:12px;font-family:Manrope,sans-serif}
.hours{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scroll-snap-type:x mandatory}
.hours .h{scroll-snap-align:start;flex:0 0 66px;text-align:center;background:var(--surface2);border-radius:12px;padding:10px 6px;border:1px solid transparent}
.hours .h.now{border-color:var(--accent)}
.hours .h .k{font-size:11px;color:var(--ink3)}
.hours .h .s{font-size:22px;line-height:1.3}
.hours .h .t{font-family:Sora,sans-serif;font-weight:600}
.hours .h .p{font-size:11px;color:var(--rain);font-weight:600}
.days{display:flex;flex-direction:column;margin-top:6px}
.days .d{display:grid;grid-template-columns:1.1fr 32px 1fr 44px 44px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.days .d:first-child{border-top:0}
.days .d .name{font-weight:600}
.days .d .bar{height:6px;border-radius:3px;background:var(--surface2);position:relative;overflow:hidden}
.days .d .bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--rain),var(--sun))}
.days .d .p{font-size:12px;color:var(--rain);font-weight:600;text-align:right}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.kv div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.kv .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kv .v{font-family:Sora,sans-serif;font-weight:600;font-size:18px;margin-top:2px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--storm) 14%,transparent);border:1px solid color-mix(in srgb,var(--storm) 45%,transparent);margin-top:8px}
.alert.warn{background:color-mix(in srgb,var(--sun) 14%,transparent);border-color:color-mix(in srgb,var(--sun) 50%,transparent)}
.alert.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.alert .s{font-size:20px;line-height:1.2}
.alert b{display:block}
.ai-box{margin-top:10px;background:var(--surface2);border-radius:12px;padding:12px;min-height:54px;white-space:pre-wrap;font-size:14px}
.rank{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rank button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface2);text-align:left;width:100%}
.rank button:hover{outline:1px solid var(--accent)}
.rank .t{font-family:Sora,sans-serif;font-weight:600}
.rank .c{font-size:12px;color:var(--ink3)}
/* community */
.feedhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.feedhead h2{font-size:22px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.composer textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;color:var(--ink)}
.composer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.composer select{padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface2)}
.tag.on{border-color:var(--accent);color:var(--accent)}
.note{font-size:12px;color:var(--ink3);margin-top:6px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.post .who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:700;color:#fff;flex:0 0 auto}
.post .meta{font-size:12px;color:var(--ink3)}
.post .meta b{color:var(--ink2)}
.post .body{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .wx{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.post .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.post .acts .ib{height:32px;font-size:12px}
.post .acts .ib.liked{color:var(--storm);border-color:var(--storm)}
.comments{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.comments .c{font-size:13px;background:var(--surface2);border-radius:10px;padding:7px 10px}
.comments .c b{font-weight:700}
.comments form{display:flex;gap:6px}
.comments input{flex:1;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.empty{text-align:center;color:var(--ink3);padding:30px 10px}
/* AI */
.chat{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
.chat .log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chat form{display:flex;gap:8px;margin-top:6px}
.chat input{flex:1;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.aihead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.aihead .av{background:linear-gradient(135deg,#38BDF8,#6C8CFF)}
.aihead h2{font-size:20px}
.aihead p{margin:0;font-size:13px;color:var(--ink3)}
/* profile */
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:8px 14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.share-box{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.share-box input{flex:1;min-width:200px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--storm);color:#fff;font-size:11px;font-weight:700}
.intro{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:40;display:grid;place-items:center;padding:16px}
.intro .box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:460px;width:100%;box-shadow:var(--shadow)}
.intro h1{font-size:28px;margin-bottom:6px}
.intro p{color:var(--ink2);margin:0 0 14px}
.intro .feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.intro .feat div{background:var(--surface2);border-radius:12px;padding:10px;font-size:13px;font-weight:600}
.intro .feat span{display:block;font-size:20px}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== v2: stories / reels feed ===== */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.story{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;scroll-snap-align:start}
.story .ring{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(from 180deg,#38BDF8,#6C8CFF,#F5B841,#F87171,#38BDF8)}
.story .ring.seen{background:var(--line)}
.story .in{width:100%;height:100%;border-radius:50%;background:var(--surface);border:2px solid var(--bg);display:grid;place-items:center;font-size:24px;position:relative}
.story .in b{position:absolute;bottom:-4px;right:-4px;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 5px;font-family:Sora}
.story .n{font-size:11px;font-weight:600;color:var(--ink2);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story.add .ring{background:var(--surface2);border:2px dashed var(--line)}
.modeSeg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.modeSeg button{padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink3)}
.modeSeg button.on{background:var(--accent);color:var(--accent-ink)}
.reels{display:flex;flex-direction:column;gap:12px}
.reel{position:relative;border-radius:22px;overflow:hidden;min-height:440px;color:#fff;box-shadow:var(--shadow);isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:#1E3A8A}
.reel canvas.fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.reel .bgsym{position:absolute;right:76px;top:14px;font-size:76px;line-height:1;opacity:.9;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));z-index:1;transform:rotate(8deg)}
.reel .rtop{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:10px;z-index:2}
.reel .rtop .av{width:40px;height:40px;border:2px solid rgba(255,255,255,.8)}
.reel .rtop b{font-family:Sora;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.reel .rtop small{display:block;font-size:12px;opacity:.9}
.reel .txt{position:relative;z-index:2;padding-right:60px;font-family:Sora;font-weight:600;font-size:clamp(20px,3.4vw,30px);line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.4);max-width:78%;text-wrap:balance}
.reel .sub{position:relative;z-index:2;padding-right:60px;margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.reel .sub .pill{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px;font-weight:600}
.reel .rail{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:12px;z-index:3;align-items:center}
