name: Check MeteoSocial
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node test-daily-question.mjs
      - run: node test-profession.mjs
      - run: node test-sky-confirm.mjs
